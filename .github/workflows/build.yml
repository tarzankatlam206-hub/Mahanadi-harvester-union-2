name: Build Signed APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install -g eas-cli
      - run: eas build --platform android --profile preview --local --non-interactive --output./app-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path:./app-signed.apk
